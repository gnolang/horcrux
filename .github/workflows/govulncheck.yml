name: govulncheck

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Manifest-available base; the scan step below pins the toolchain it
          # runs under.
          go-version: '1.25.x'

      - name: Run govulncheck
        # Pin the toolchain the scan runs under to the Go toolchain of the golang
        # image docker/horcrux/Dockerfile pins by digest, which builds the shipped
        # binary, so the scan covers the standard library that ships. go.mod's
        # toolchain line does not govern that build: the image sets
        # GOTOOLCHAIN=local, which ignores it.
        env:
          GOTOOLCHAIN: go1.25.14
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
