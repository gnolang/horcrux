name: govulncheck

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Manifest-available base; go.mod's toolchain directive upgrades it via
          # GOTOOLCHAIN=auto so the scan runs against the patched standard library.
          go-version: '1.25.x'

      - name: Run govulncheck
        # go run <tool>@latest honours the go directive but not the toolchain directive,
        # so pin the patched toolchain explicitly. Keep in sync with go.mod's toolchain.
        env:
          GOTOOLCHAIN: go1.25.13
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
