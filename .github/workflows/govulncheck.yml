name: govulncheck

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Latest 1.25.x patch, matching the published golang:1.25-alpine image.
          # go.mod pins go 1.25.0, whose stdlib carries vulnerabilities fixed in
          # later 1.25.x patches; scanning that exact patch reports false positives.
          go-version: '1.25.x'

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
