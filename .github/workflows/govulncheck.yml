name: govulncheck

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Manifest-available base; go.mod's toolchain directive upgrades it via
          # GOTOOLCHAIN=auto so the scan runs against the patched standard library.
          go-version: '1.25.x'

      - name: Run govulncheck
        # Force the toolchain upgrade in case setup-go pins GOTOOLCHAIN=local.
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
