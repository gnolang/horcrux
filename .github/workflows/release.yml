name: Release

# Publishes the gnolang/horcrux container image on a version tag. Builds
# linux/amd64 from docker/horcrux/Dockerfile and pushes
# ghcr.io/gnolang/horcrux:<tag>. The resulting manifest digest is recorded as
# a job output, in the GitHub release notes, and in the job summary so a
# deployment can pin <tag>@sha256:<digest>.
#
# amd64 only: every cosigner host is x86, and the fork's own CI dropped the
# arm64 leg because the emulated cross-build was impractically slow.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    name: Build and publish the release image
    runs-on: ubuntu-latest
    # A native Go build and one image push.
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the release image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/horcrux/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Record the pinned image reference
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Publish the digest to the GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PINNED_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          notes="Image: \`${PINNED_IMAGE}\`"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes"
          fi

      - name: Write the digest to the job summary
        env:
          PINNED_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "### horcrux image published"
            echo
            echo '```'
            echo "${PINNED_IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
